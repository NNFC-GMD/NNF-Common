name: Site

# Builds the site, checks every page in a browser, and publishes it to
# https://nnfc-gmd.github.io/NNF-Common/.
#
# One-time repository setting required: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions". Until it is made this workflow
# cannot publish.

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "website/**"
      - "pyproject.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yml"
  # Lets the site be rebuilt without a change, for example after enabling Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but do not cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # setup-pixi wants the leading v.
  PIXI_VERSION: v0.81.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6.0.0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: default e2e
          locked: true
          cache: true
      - run: pixi run build
      # A page that fails in the browser is not published.
      - run: pixi run -e e2e check-site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
