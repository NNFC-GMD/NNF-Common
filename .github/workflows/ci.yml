name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # setup-pixi wants the leading v.
  PIXI_VERSION: v0.81.0

jobs:
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          run-install: false
      # Fails if pyproject.toml changed without `pixi lock`.
      - run: pixi lock --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: dev
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Every hook on every tracked file: ruff, the size limits, tabs, markdownlint.
      - run: pixi run -e dev lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: dev
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - run: pixi run -e dev test
      - name: Tests left the working tree clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: default e2e
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      # Exports every notebook, running each one first.
      - run: pixi run build
      # Opens every page in the runner's Google Chrome and waits until Python
      # has finished in the browser.
      - run: pixi run -e e2e check-site
